name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  w0-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check prototypes/w0/studio.mjs
      - run: node --test prototypes/w0/*.test.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: >-
          python -m ruff check
          legacy/core-import-v1/rka_writer_staging.py
          legacy/core-import-v1/tests/test_staging_import.py
          tests/test_design_repository.py
